<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campaign Hub - AERTHOS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background-color: #000;
            color: #0f0;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            border: 3px solid #0f0;
            background-color: #001a00;
            padding: 30px;
            box-shadow: 0 0 20px #0f0;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #0a0;
        }

        .title {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 10px;
            text-shadow: 0 0 10px #0f0;
        }

        .subtitle {
            font-size: 14px;
            color: #0a0;
        }

        .section {
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
            padding-bottom: 5px;
            border-bottom: 1px solid #0a0;
            color: #0f0;
        }

        .menu-item {
            background-color: #002200;
            border: 2px solid #0a0;
            padding: 15px 20px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .menu-item:hover {
            background-color: #003300;
            border-color: #0f0;
            box-shadow: 0 0 10px #0a0;
            transform: translateX(5px);
        }

        .menu-item-title {
            flex: 1;
            font-weight: bold;
            font-size: 16px;
        }

        .menu-item-desc {
            font-size: 12px;
            color: #0a0;
            margin-left: 20px;
        }

        .party-status {
            background-color: #002200;
            border: 2px solid #0a0;
            padding: 20px;
            margin-bottom: 20px;
        }

        .party-member {
            padding: 10px;
            border-bottom: 1px solid #0a0;
            display: flex;
            justify-content: space-between;
        }

        .party-member:last-child {
            border-bottom: none;
        }

        .member-name {
            font-weight: bold;
        }

        .member-stats {
            font-size: 12px;
            color: #0a0;
        }

        .hp-bar {
            display: inline-block;
            width: 100px;
            height: 12px;
            background-color: #330000;
            border: 1px solid #0a0;
            margin-left: 10px;
            position: relative;
        }

        .hp-fill {
            height: 100%;
            background-color: #00ff00;
            transition: width 0.3s;
        }

        .message {
            padding: 15px;
            margin-bottom: 20px;
            border: 2px solid;
            display: none;
        }

        .message.success {
            border-color: #0f0;
            background-color: #003300;
        }

        .message.error {
            border-color: #f00;
            background-color: #330000;
            color: #f00;
        }

        .message.active {
            display: block;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #0a0;
            text-decoration: none;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: #0f0;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #ff0;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        .blink {
            animation: blink 1s infinite;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="title" id="hub-name">LOADING...</div>
            <div class="subtitle" id="campaign-name">Campaign</div>
        </div>

        <div id="message" class="message"></div>

        <!-- Party Status -->
        <div class="section">
            <div class="section-title">PARTY STATUS</div>
            <div id="party-status" class="party-status">
                <div class="loading">Loading party...</div>
            </div>
        </div>

        <!-- Hub Menu -->
        <div class="section">
            <div class="section-title">CAMPAIGN MENU</div>
            
            {% if active_session_id %}
            <div class="menu-item" onclick="resumeGame('{{ active_session_id }}')">
                <div class="menu-item-title">▶ RESUME ADVENTURE</div>
                <div class="menu-item-desc">Continue your exploration in the dungeon</div>
            </div>
            {% endif %}
            
            <!-- Dynamic Hub Menu (Shop, Inn, Temple, Travel, etc.) -->
            <div id="hub-menu"></div>
        </div>


        <a href="/campaign_manager" class="back-link">← Back to Campaign Manager</a>
    </div>

    <script>
        // Extract campaign_id from URL path: /campaign/{campaign_id}/hub
        const pathParts = window.location.pathname.split('/');
        const campaignId = pathParts[2]; // /campaign/{id}/hub -> index 2

        if (!campaignId) {
            showMessage('No campaign ID provided', 'error');
        } else {
            loadHubData();
        }

        function showMessage(text, type = 'success') {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = `message ${type} active`;
            setTimeout(() => {
                msg.className = 'message';
            }, 5000);
        }

        function resumeGame(sessionId) {
            window.location.href = `/game?session_id=${sessionId}`;
        }

        async function loadHubData() {
            try {
                // Load hub menu
                const response = await fetch(`/api/campaigns/${campaignId}/hub_menu`);
                const data = await response.json();

                if (data.success) {
                    // Update header
                    document.getElementById('hub-name').textContent = data.hub.name;
                    document.getElementById('campaign-name').textContent = data.campaign.name;

                    // Display party
                    displayParty(data.party);

                    // Display menu
                    displayHubMenu(data.menu_options);
                } else {
                    showMessage('Error: ' + data.error, 'error');
                }
            } catch (error) {
                console.error('Error loading hub:', error);
                showMessage('Error loading hub: ' + error.message, 'error');
            }
        }

        function displayParty(party) {
            const partyEl = document.getElementById('party-status');

            if (!party || party.length === 0) {
                partyEl.innerHTML = '<div>No party members</div>';
                return;
            }

            partyEl.innerHTML = party.map(member => {
                const hpPercent = (member.hp_current / member.hp_max) * 100;
                const status = member.is_alive ? 'ALIVE' : 'DEAD';
                const statusClass = member.is_alive ? '' : 'style="color: #f00;"';

                return `
                    <div class="party-member">
                        <div>
                            <span class="member-name">${member.name}</span>
                            <span class="member-stats">(${member.race} ${member.char_class} Lvl ${member.level})</span>
                            <span ${statusClass}>[${status}]</span>
                        </div>
                        <div>
                            <span class="member-stats">HP: ${member.hp_current}/${member.hp_max}</span>
                            <div class="hp-bar">
                                <div class="hp-fill" style="width: ${hpPercent}%"></div>
                            </div>
                            <span class="member-stats">Gold: ${member.gold}gp</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function displayHubMenu(options) {
            const menuEl = document.getElementById('hub-menu');

            if (!options || options.length === 0) {
                menuEl.innerHTML = '<div>No menu options available</div>';
                return;
            }

            menuEl.innerHTML = options.map(option => `
                <div class="menu-item" onclick="handleMenuChoice('${option.action}', '${option.id}')">
                    <span class="menu-item-title">${option.name}</span>
                    <span class="menu-item-desc">${option.description || ''}</span>
                </div>
            `).join('');
        }

        function handleMenuChoice(action, optionId) {
            if (action === 'enter_inn') {
                goToInn();
            } else if (action === 'enter_shop') {
                goToShop(optionId);
            } else if (action === 'enter_temple') {
                goToTemple();
            } else if (action === 'enter_guild') {
                showMessage('Guild interface coming soon', 'success');
            } else if (action === 'travel_menu') {
                goToTravel();
            } else if (action === 'view_journal') {
                showJournal();
            } else if (action === 'manage_party') {
                showMessage('Party management coming soon', 'success');
            } else {
                showMessage('Unknown action: ' + action, 'error');
            }
        }

        function goToInn() {
            window.location.href = `/campaign/${campaignId}/inn`;
        }

        function goToShop(shopId) {
            // Extract shop_id from the menu option data
            const shop_id = shopId.replace('shop_', '');
            window.location.href = `/campaign/${campaignId}/shop/${shop_id}`;
        }

        function goToTemple() {
            window.location.href = `/campaign/${campaignId}/temple`;
        }

        function goToTravel() {
            // Redirect to episode list
            window.location.href = `/campaign/${campaignId}/episodes`;
        }

        async function showJournal() {
            try {
                const response = await fetch(`/api/campaigns/${campaignId}/load`);
                const data = await response.json();

                if (data.success) {
                    const campaign = data.campaign;

                    let journalText = `Campaign: ${campaign.name}\n\n`;
                    journalText += `Episodes Completed: ${campaign.completed_episodes.length}\n`;
                    campaign.completed_episodes.forEach(ep => {
                        journalText += `  ✓ ${ep}\n`;
                    });
                    journalText += `\nEpisodes Unlocked: ${campaign.unlocked_episodes.length}\n`;
                    campaign.unlocked_episodes.forEach(ep => {
                        if (!campaign.completed_episodes.includes(ep)) {
                            journalText += `  ● ${ep}\n`;
                        }
                    });
                    journalText += `\nStory Flags:\n`;
                    Object.entries(campaign.story_flags || {}).forEach(([flag, value]) => {
                        journalText += `  • ${flag}: ${value}\n`;
                    });

                    alert(journalText);
                } else {
                    showMessage('Error loading journal: ' + data.error, 'error');
                }
            } catch (error) {
                showMessage('Error: ' + error.message, 'error');
            }
        }
    </script>
</body>
</html>
