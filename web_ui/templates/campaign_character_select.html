<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Character - AERTHOS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background-color: #000;
            color: #0f0;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 800px;
            width: 100%;
            border: 3px solid #0f0;
            background-color: #001a00;
            padding: 30px;
            box-shadow: 0 0 30px #0f0;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #0a0;
        }

        .title {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #0f0;
        }

        .subtitle {
            font-size: 14px;
            color: #0a0;
        }

        .character-list {
            display: grid;
            gap: 15px;
            margin-bottom: 30px;
        }

        .character-item {
            background-color: #002200;
            border: 2px solid #0a0;
            padding: 20px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .character-item:hover {
            background-color: #003300;
            border-color: #0f0;
            transform: translateX(10px);
            box-shadow: 0 0 15px #0a0;
        }

        .character-info {
            flex: 1;
        }

        .char-name {
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            margin-bottom: 5px;
        }

        .char-details {
            font-size: 14px;
            color: #0f0;
        }

        .char-status {
            font-size: 14px;
            font-weight: bold;
            padding: 5px 10px;
            border-radius: 4px;
        }

        .status-alive {
            color: #0f0;
            border: 1px solid #0f0;
        }

        .status-dead {
            color: #f00;
            border: 1px solid #f00;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #0a0;
        }

        .error {
            background-color: #330000;
            border: 2px solid #f00;
            color: #f00;
            padding: 15px;
            text-align: center;
            margin-bottom: 20px;
            display: none;
        }

        .btn-back {
            display: block;
            text-align: center;
            color: #0a0;
            text-decoration: none;
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #0a0;
            width: fit-content;
            margin: 0 auto;
        }

        .btn-back:hover {
            background-color: #002200;
            color: #0f0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="title">WHO WILL LEAD THE PARTY?</div>
            <div class="subtitle">Select the active character to control in the dungeon</div>
        </div>

        <div id="error-msg" class="error"></div>

        <div id="character-list" class="character-list">
            <div class="loading">Loading party data...</div>
        </div>

        <a href="#" onclick="history.back()" class="btn-back">← Cancel</a>
    </div>

    <script>
        const campaignId = "{{ campaign_id }}";
        const episodeId = "{{ episode_id }}";

        // Load party data on page load
        loadParty();

        async function loadParty() {
            try {
                const response = await fetch(`/api/campaigns/${campaignId}/hub_menu`);
                const data = await response.json();

                if (data.success) {
                    renderParty(data.party);
                } else {
                    showError('Failed to load party: ' + data.error);
                }
            } catch (error) {
                showError('Error loading party: ' + error.message);
            }
        }

        function renderParty(party) {
            const listEl = document.getElementById('character-list');
            
            if (!party || party.length === 0) {
                listEl.innerHTML = '<div class="loading">No party members found.</div>';
                return;
            }

            listEl.innerHTML = party.map((member, index) => {
                if (!member.is_alive) {
                    return `
                        <div class="character-item" style="opacity: 0.5; cursor: not-allowed;">
                            <div class="character-info">
                                <div class="char-name" style="color: #f00;">${member.name}</div>
                                <div class="char-details">${member.race} ${member.char_class} (Lvl ${member.level})</div>
                            </div>
                            <div class="char-status status-dead">DEAD</div>
                        </div>
                    `;
                }

                return `
                    <div class="character-item" onclick="selectCharacter(${index})">
                        <div class="character-info">
                            <div class="char-name">${member.name}</div>
                            <div class="char-details">
                                ${member.race} ${member.char_class} (Lvl ${member.level})<br>
                                HP: ${member.hp_current}/${member.hp_max}
                            </div>
                        </div>
                        <div class="char-status status-alive">SELECT</div>
                    </div>
                `;
            }).join('');
        }

        async function selectCharacter(index) {
            const listEl = document.getElementById('character-list');
            listEl.innerHTML = '<div class="loading">Initializing dungeon...</div>';

            const sessionId = 'episode_' + campaignId + '_' + episodeId + '_' + Date.now();

            try {
                const response = await fetch(`/api/campaigns/${campaignId}/episodes/${episodeId}/dungeon/init`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        session_id: sessionId,
                        character_index: index
                    })
                });

                const data = await response.json();

                if (data.success) {
                    // Redirect to game
                    window.location.href = `/game?session_id=${sessionId}&campaign_id=${campaignId}&episode_id=${episodeId}`;
                } else {
                    showError('Failed to enter dungeon: ' + data.error);
                    loadParty(); // Reload list
                }
            } catch (error) {
                showError('Error: ' + error.message);
                loadParty(); // Reload list
            }
        }

        function showError(msg) {
            const el = document.getElementById('error-msg');
            el.textContent = msg;
            el.style.display = 'block';
        }
    </script>
</body>
</html>
