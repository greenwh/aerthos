<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Roster - AERTHOS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background-color: #000;
            color: #0f0;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            border: 3px solid #0f0;
            background-color: #001a00;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #0f0;
        }

        .title {
            font-size: 32px;
            font-weight: bold;
        }

        .back-btn {
            background-color: #002200;
            border: 2px solid #0a0;
            color: #0f0;
            padding: 10px 20px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 14px;
        }

        .back-btn:hover {
            background-color: #003300;
            border-color: #0f0;
        }

        .toolbar {
            margin-bottom: 20px;
            padding: 15px;
            background-color: #002200;
            border: 2px solid #0a0;
        }

        .create-btn {
            background-color: #004400;
            border: 2px solid #0f0;
            color: #0f0;
            padding: 10px 20px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            font-weight: bold;
        }

        .create-btn:hover {
            background-color: #005500;
            box-shadow: 0 0 10px #0a0;
        }

        .character-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .character-card {
            background-color: #002200;
            border: 2px solid #0a0;
            padding: 15px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .character-card:hover {
            background-color: #003300;
            border-color: #0f0;
            box-shadow: 0 0 10px #0a0;
        }

        .char-name {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 5px;
            color: #0f0;
        }

        .char-info {
            font-size: 14px;
            margin-bottom: 3px;
            color: #0a0;
        }

        .char-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #0a0;
        }

        .stat {
            font-size: 12px;
        }

        .char-actions {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #0a0;
            display: flex;
            gap: 10px;
        }

        .action-btn {
            background-color: #001100;
            border: 1px solid #0a0;
            color: #0f0;
            padding: 5px 10px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            flex: 1;
        }

        .action-btn:hover {
            background-color: #002200;
            border-color: #0f0;
        }

        .action-btn.delete {
            color: #f00;
            border-color: #a00;
        }

        .action-btn.delete:hover {
            background-color: #330000;
            border-color: #f00;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #0a0;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background-color: #001a00;
            border: 3px solid #0f0;
            padding: 30px;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #0f0;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-label {
            display: block;
            margin-bottom: 5px;
            color: #0f0;
        }

        .form-input, .form-select {
            width: 100%;
            background-color: #002200;
            border: 2px solid #0a0;
            color: #0f0;
            padding: 8px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
        }

        .form-input:focus, .form-select:focus {
            outline: none;
            border-color: #0f0;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .modal-btn {
            flex: 1;
            padding: 10px;
            border: 2px solid #0a0;
            background-color: #002200;
            color: #0f0;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 14px;
        }

        .modal-btn:hover {
            background-color: #003300;
            border-color: #0f0;
        }

        .modal-btn.primary {
            background-color: #004400;
            border-color: #0f0;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #ff0;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        .blink {
            animation: blink 1s infinite;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="title">CHARACTER ROSTER</div>
            <button class="back-btn" onclick="goBack()">← Back to Menu</button>
        </div>

        <div class="toolbar">
            <button class="create-btn" onclick="goToCharacterCreation()">⚔ Create New Character</button>
            <button class="create-btn" onclick="goToManualImport()" style="margin-left: 10px;">📥 Import Existing Character</button>
        </div>

        <div id="characterList" class="character-list">
            <div class="loading"><span class="blink">Loading characters...</span></div>
        </div>
    </div>

    <!-- View Character Modal -->
    <div id="viewModal" class="modal">
        <div class="modal-content">
            <div class="modal-title" id="viewCharName">Character Details</div>
            <div id="viewCharDetails"></div>
            <div class="modal-actions">
                <button class="modal-btn" onclick="closeViewModal()">Close</button>
            </div>
        </div>
    </div>

    <script>
        let characters = [];

        function loadCharacters() {
            fetch('/api/characters')
                .then(response => response.json())
                .then(data => {
                    characters = data.characters || [];
                    renderCharacters();
                })
                .catch(error => {
                    console.error('Error loading characters:', error);
                    document.getElementById('characterList').innerHTML =
                        '<div class="empty-state">Error loading characters</div>';
                });
        }

        function renderCharacters() {
            const listEl = document.getElementById('characterList');

            if (characters.length === 0) {
                listEl.innerHTML = '<div class="empty-state">No characters yet. Create one to begin!</div>';
                return;
            }

            listEl.innerHTML = characters.map(char => `
                <div class="character-card">
                    <div class="char-name">${char.name}</div>
                    <div class="char-info">${char.race} ${char.char_class}</div>
                    <div class="char-info">Level ${char.level} | XP: ${char.xp}</div>
                    <div class="char-stats">
                        <div class="stat">HP: ${char.hp_current}/${char.hp_max}</div>
                        <div class="stat">AC: ${char.ac}</div>
                        <div class="stat">Gold: ${char.gold}</div>
                    </div>
                    <div class="char-actions">
                        <button class="action-btn" onclick="viewCharacter('${char.id}')">View</button>
                        <button class="action-btn delete" onclick="deleteCharacter('${char.id}', '${char.name}')">Delete</button>
                    </div>
                </div>
            `).join('');
        }

        // DEPRECATED: Old modal functions - character creation now uses /character_creation page
        /*
        function showCreateModal() {
            document.getElementById('createModal').style.display = 'flex';

        function closeCreateModal() {

        function closeViewModal() {
            document.getElementById('viewModal').style.display = 'none';
        }

        function viewCharacter(charId) {
            fetch('/api/characters/' + charId)
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        const char = data.character;
                        document.getElementById('viewCharName').textContent = char.name;

                        let html = '<div style="line-height: 1.6;">';

                        // === BASIC INFO ===
                        html += '<div style="margin-bottom: 15px; padding-bottom: 10px; border-bottom: 2px solid #0a0;">';
                        html += `<p><strong>Race:</strong> ${char.race} | <strong>Class:</strong> ${char.char_class} | <strong>Alignment:</strong> ${char.alignment}</p>`;
                        html += `<p><strong>Level:</strong> ${char.level} | <strong>XP:</strong> ${char.xp} / ${char.xp_to_next_level}</p>`;
                        html += `<p><strong>HP:</strong> ${char.hp_current}/${char.hp_max} | <strong>AC:</strong> ${char.ac} | <strong>THAC0:</strong> ${char.thac0}</p>`;

                        // Money breakdown
                        if (char.money && (char.money.cp > 0 || char.money.sp > 0 || char.money.ep > 0 || char.money.gp > 0 || char.money.pp > 0)) {
                            let moneyParts = [];
                            if (char.money.pp > 0) moneyParts.push(`${char.money.pp} pp`);
                            if (char.money.gp > 0) moneyParts.push(`${char.money.gp} gp`);
                            if (char.money.ep > 0) moneyParts.push(`${char.money.ep} ep`);
                            if (char.money.sp > 0) moneyParts.push(`${char.money.sp} sp`);
                            if (char.money.cp > 0) moneyParts.push(`${char.money.cp} cp`);
                            html += `<p><strong>Money:</strong> ${moneyParts.join(', ')} | <strong>Weight:</strong> ${char.weight.toFixed(1)} / ${char.weight_max} lbs</p>`;
                        } else if (char.gold > 0) {
                            // Fallback for old characters without money breakdown
                            html += `<p><strong>Gold:</strong> ${char.gold} gp | <strong>Weight:</strong> ${char.weight.toFixed(1)} / ${char.weight_max} lbs</p>`;
                        } else {
                            html += `<p><strong>Money:</strong> 0 gp | <strong>Weight:</strong> ${char.weight.toFixed(1)} / ${char.weight_max} lbs</p>`;
                        }
                        html += '</div>';

                        // === ABILITY SCORES ===
                        html += '<div style="margin-bottom: 15px;">';
                        html += '<p style="color: #ff0; font-weight: bold; margin-bottom: 5px;">■ ABILITY SCORES</p>';
                        html += '<div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px;">';
                        html += `<span>STR: ${char.abilities.strength}${char.abilities.strength_percentile > 0 ? '/' + char.abilities.strength_percentile : ''}</span>`;
                        html += `<span>DEX: ${char.abilities.dexterity}</span>`;
                        html += `<span>CON: ${char.abilities.constitution}</span>`;
                        html += `<span>INT: ${char.abilities.intelligence}</span>`;
                        html += `<span>WIS: ${char.abilities.wisdom}</span>`;
                        html += `<span>CHA: ${char.abilities.charisma}</span>`;
                        html += '</div></div>';

                        // === SAVING THROWS ===
                        html += '<div style="margin-bottom: 15px;">';
                        html += '<p style="color: #ff0; font-weight: bold; margin-bottom: 5px;">■ SAVING THROWS</p>';
                        html += '<div style="font-size: 13px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 3px;">';
                        html += `<span>Poison/Death: ${char.saving_throws.poison}</span>`;
                        html += `<span>Rod/Staff/Wand: ${char.saving_throws.rod_staff_wand}</span>`;
                        html += `<span>Petrify/Paralyze: ${char.saving_throws.petrify_paralyze}</span>`;
                        html += `<span>Breath Weapon: ${char.saving_throws.breath}</span>`;
                        html += `<span>Spell: ${char.saving_throws.spell}</span>`;
                        html += '</div></div>';

                        // === EQUIPMENT (What's Equipped) ===
                        html += '<div style="margin-bottom: 15px;">';
                        html += '<p style="color: #ff0; font-weight: bold; margin-bottom: 5px;">■ EQUIPPED</p>';
                        if (Object.keys(char.equipment).length > 0) {
                            if (char.equipment.weapon) {
                                const weapon = char.equipment.weapon;
                                const bonus = weapon.magic_bonus > 0 ? ` +${weapon.magic_bonus}` : '';
                                html += `<p style="margin-left: 10px;">⚔ Weapon: ${weapon.name}${bonus} (${weapon.damage_sm}/${weapon.damage_l})</p>`;
                            }
                            if (char.equipment.armor) {
                                const armor = char.equipment.armor;
                                const bonus = armor.magic_bonus > 0 ? ` +${armor.magic_bonus}` : '';
                                html += `<p style="margin-left: 10px;">🛡 Armor: ${armor.name}${bonus} (AC ${armor.ac})</p>`;
                            }
                            if (char.equipment.shield) {
                                const shield = char.equipment.shield;
                                const bonus = shield.magic_bonus > 0 ? ` +${shield.magic_bonus}` : '';
                                html += `<p style="margin-left: 10px;">🛡 Shield: ${shield.name}${bonus} (AC +${shield.ac_bonus})</p>`;
                            }
                            if (char.equipment.light_source) {
                                const light = char.equipment.light_source;
                                html += `<p style="margin-left: 10px;">🔦 Light: ${light.name} (${light.turns_remaining} turns)</p>`;
                            }
                        } else {
                            html += '<p style="margin-left: 10px; color: #0a0;">Nothing equipped</p>';
                        }
                        html += '</div>';

                        // === INVENTORY ===
                        html += '<div style="margin-bottom: 15px;">';
                        html += '<p style="color: #ff0; font-weight: bold; margin-bottom: 5px;">■ INVENTORY</p>';
                        if (char.inventory.length > 0) {
                            html += '<div style="max-height: 200px; overflow-y: auto; border: 1px solid #0a0; padding: 5px; background-color: #001100;">';
                            char.inventory.forEach(item => {
                                let itemDesc = item.name;
                                if (item.magic_bonus > 0) {
                                    itemDesc += ` +${item.magic_bonus}`;
                                }
                                if (item.damage_sm) {
                                    itemDesc += ` (${item.damage_sm}/${item.damage_l})`;
                                } else if (item.ac) {
                                    itemDesc += ` (AC ${item.ac})`;
                                }
                                itemDesc += ` [${item.weight} lbs]`;
                                html += `<p style="margin: 2px 0; padding-left: 10px;">• ${itemDesc}</p>`;
                            });
                            html += '</div>';
                        } else {
                            html += '<p style="margin-left: 10px; color: #0a0;">Empty</p>';
                        }
                        html += '</div>';

                        // === SPELLS (for casters) ===
                        if (char.spells_known.length > 0 || char.spells_memorized.length > 0) {
                            html += '<div style="margin-bottom: 15px;">';
                            html += '<p style="color: #ff0; font-weight: bold; margin-bottom: 5px;">■ SPELLS</p>';

                            // Spells Known
                            if (char.spells_known.length > 0) {
                                html += '<p style="margin-left: 10px; color: #0f0; font-weight: bold;">Spells Known:</p>';
                                html += '<div style="margin-left: 20px; font-size: 13px;">';
                                char.spells_known.forEach(spell => {
                                    html += `<p style="margin: 2px 0;">• ${spell.name} (Lvl ${spell.level}, ${spell.school})</p>`;
                                });
                                html += '</div>';
                            }

                            // Spell Slots
                            if (char.spells_memorized.length > 0) {
                                html += '<p style="margin-left: 10px; margin-top: 10px; color: #0f0; font-weight: bold;">Memorized Spells:</p>';
                                html += '<div style="margin-left: 20px; font-size: 13px;">';
                                char.spells_memorized.forEach((slot, idx) => {
                                    const status = slot.is_used ? '[USED]' : '[READY]';
                                    const color = slot.is_used ? '#666' : '#0f0';
                                    if (slot.spell) {
                                        html += `<p style="margin: 2px 0; color: ${color};">${status} ${slot.spell.name} (Lvl ${slot.spell.level})</p>`;
                                    } else {
                                        html += `<p style="margin: 2px 0; color: ${color};">${status} Level ${slot.level} [Empty]</p>`;
                                    }
                                });
                                html += '</div>';
                            }
                            html += '</div>';
                        }

                        // === THIEF SKILLS ===
                        if (char.thief_skills) {
                            html += '<div style="margin-bottom: 15px;">';
                            html += '<p style="color: #ff0; font-weight: bold; margin-bottom: 5px;">■ THIEF SKILLS</p>';
                            html += '<div style="margin-left: 10px; font-size: 13px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 3px;">';
                            for (const [skill, value] of Object.entries(char.thief_skills)) {
                                const skillName = skill.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
                                html += `<span>${skillName}: ${value}%</span>`;
                            }
                            html += '</div></div>';
                        }

                        html += '</div>';

                        document.getElementById('viewCharDetails').innerHTML = html;
                        document.getElementById('viewModal').style.display = 'flex';
                    } else {
                        alert('Error loading character: ' + data.error);
                    }
                })
                .catch(error => {
                    alert('Error: ' + error);
                });
        }

        function deleteCharacter(charId, charName) {
            if (!confirm(`Delete ${charName}? This cannot be undone.`)) {
                return;
            }

            fetch('/api/characters/' + charId, {
                method: 'DELETE'
            })
            .then(response => response.json())
            .then(result => {
                if (result.success) {
                    loadCharacters();
                } else {
                    alert('Error: ' + result.error);
                }
            })
            .catch(error => {
                alert('Error deleting character: ' + error);
            });
        }

        function goBack() {
            window.location.href = '/';
        }

        function goToCharacterCreation() {
            window.location.href = '/character_creation';
        }

        function goToManualImport() {
            window.location.href = '/manual_import';
        }

        // Load characters on page load
        loadCharacters();
    </script>
</body>
